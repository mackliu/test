<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <title>羅羅諾亞·索隆 - 成員介紹</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            margin: 0;
            padding: 0;

            color: #fff;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            color: #ffcc00;
            margin-bottom: 20px;
        }
        a {
            color: #ffcc00;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

            background: rgba(255,255,255,0.1);

            border-radius: 15px;

        }
        .banner img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .gallery img {
            width: 100%;
            border-radius: 15px;
            object-fit: cover;
            min-height: 140px;
        }

<body>
    <div class="container">
        <h1>羅羅諾亞·索隆</h1>
        <section class="banner">

            <img src="https://via.placeholder.com/900x300/ffd700/1a1728?text=索隆+懸賞公告" alt="索隆懸賞公告">
            <p>索隆因其強大的三刀流技藝與不屈毅力，成為海賊團中最值得信賴的戰士之一。</p>
        </section>
        <section>
            <p><strong>身份：</strong>草帽海賊團劍士</p>

            <p><strong>特色技能：</strong>三刀流、鬼斬、旋風斬、空氣斬、力量爆發。</p>
