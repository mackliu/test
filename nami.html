<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>娜美 - 成員介紹</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #143a5f, #366b92);
            color: #fff;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            color: #ffcc00;
            margin-bottom: 20px;
        }
        a {
            color: #ffcc00;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        section {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .banner img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .gallery img {
            width: 100%;
            border-radius: 15px;
            object-fit: cover;
            min-height: 140px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>娜美</h1>
        <section class="banner">
            <h2>懸賞公告</h2>
            <img src="https://via.placeholder.com/900x300/ffd35c/143a5f?text=娜美+懸賞公告" alt="娜美懸賞公告">
            <p>娜美以其航海才能與氣象分析，成為草帽海賊團中不可或缺的航海士，懸賞金額也不斷提高。</p>
        </section>
        <section>
            <p><strong>身份：</strong>草帽海賊團航海士</p>
            <p><strong>專長能力：</strong>熟悉氣象觀測與航海學，精通製圖與風向分析，能在惡劣海域中為船隊指引航線。</p>
            <p><strong>背景：</strong>娜美成長於柯拉松村，擁有繪製世界地圖的夢想。她以其聰明才智與堅毅性格，成為船隊中不可或缺的策略支援。</p>
            <p><strong>特色技能：</strong>氣象分析、三節棍戰鬥、天候棒操作、海圖製作。</p>
        </section>
        <section>
            <h2>成員恣態</h2>
            <div class="gallery">
                <img src="https://via.placeholder.com/400x250/ffd35c/143a5f?text=娜美+繪製海圖" alt="娜美繪製海圖">
                <img src="https://via.placeholder.com/400x250/ffd35c/143a5f?text=娜美+天候棒" alt="娜美天候棒">
                <img src="https://via.placeholder.com/400x250/ffd35c/143a5f?text=娜美+笑容" alt="娜美笑容">
                <img src="https://via.placeholder.com/400x250/ffd35c/143a5f?text=娜美+航海指揮" alt="娜美航海指揮">
            </div>
        </section>
        <p><a href="index.html">← 回到草帽海賊團介紹</a></p>
    </div>
</body>
</html>
